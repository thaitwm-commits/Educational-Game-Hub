<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fairground Word Catch - Turbo Mode</title>
    <style>
        :root {
            --arcade-orange: #ff8c00;
            --arcade-dark: #222;
            --bubble-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background: url('https://i.etsystatic.com/11810216/r/il/ba2d04/2181818551/il_fullxfull.2181818551_id8l.jpg') no-repeat center center;
            background-size: cover;
        }

        /* --- PHẦN LÀM TỐI NỀN --- */
        #overlay-dark {
            position: absolute;
            inset: 0;
            /* Tạo hiệu ứng tối dần từ ngoài vào trong */
            background: radial-gradient(circle, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0.8) 100%);
            /* Làm mờ nhẹ hình nền gốc */
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 1;
        }

        .lane {
            position: relative; flex: 1; width: 100%;
            /* Làm mờ đường kẻ lane để đỡ rối mắt trên nền tối */
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            overflow: hidden; z-index: 2;
        }

        #bottom-panel {
            height: 22vh; background: var(--arcade-orange);
            border-top: 8px solid #cc7000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; position: relative;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        #target-display {
            background: #fff; padding: 10px 35px; border-radius: 15px;
            font-size: 2.2rem; font-weight: 900; color: #333;
            border: 5px solid #333; text-transform: uppercase;
            min-height: 80px; display: flex; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #target-display img { max-height: 60px; }

        /* Bong bóng */
        .word-bubble {
            position: absolute; display: flex; align-items: center; justify-content: center;
            padding: 8px; background: var(--bubble-bg); border-radius: 20px;
            cursor: pointer; border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s; min-width: 90px;
        }
        .word-bubble img { max-height: 80px; border-radius: 10px; pointer-events: none; }
        .word-bubble span { font-size: 1.5rem; font-weight: bold; color: #222; padding: 5px 15px; }

        /* Emoji Burst */
        .emoji-burst {
            position: absolute; font-size: 2.5rem; pointer-events: none;
            animation: burstOut 0.7s ease-out forwards; z-index: 99;
        }
        @keyframes burstOut {
            0% { transform: scale(0) translate(0,0); opacity: 1; }
            100% { transform: scale(1.2) translate(var(--tx), var(--ty)); opacity: 0; }
        }

        #fail-overlay-gif {
            display: none; position: absolute; top: 20%; left: 50%;
            transform: translateX(-50%); z-index: 150; pointer-events: none;
        }
        #fail-overlay-gif img { width: 250px; border: 5px solid #fff; border-radius: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.6); }

        /* Screens */
        .full-screen {
            position: absolute; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 200; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: #fff;
        }
        .btn-main {
            padding: 15px 30px; font-size: 1.2rem; background: var(--arcade-orange);
            border: none; border-radius: 10px; color: #fff; font-weight: bold;
            cursor: pointer; margin-top: 15px; box-shadow: 0 5px 0 #cc7000;
        }
        .btn-toggle {
            background: #444; margin-bottom: 10px; border: 2px solid #fff;
        }
        .active-mode { background: #2ecc71 !important; }

        #mistake-counter { position: absolute; top: 15px; right: 20px; color: #fff; font-weight: bold; font-size: 1.3rem; z-index: 11; text-shadow: 2px 2px #000; }
        #flash-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 100; opacity: 0; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="overlay-dark"></div>

    <div id="mistake-counter">MISTAKES: 0/5</div>
    <div id="lane-1" class="lane"></div>
    <div id="lane-2" class="lane"></div>
    <div id="lane-3" class="lane"></div>

    <div id="bottom-panel">
        <div id="target-display">READY?</div>
    </div>

    <div id="flash-overlay"></div>
    <div id="fail-overlay-gif"><img src="https://i.pinimg.com/originals/9d/1a/9d/9d1a9df0ec27d025b8f3d21a9bf4e561.gif"></div>

    <div id="start-screen" class="full-screen">
        <h1 style="color: var(--arcade-orange); font-size: 3rem; margin-bottom: 0;">CARNIVAL TURBO</h1>
        <p style="margin-top: 5px; opacity: 0.8;">Select your challenge mode:</p>
        
        <div style="margin: 20px 0;">
            <button id="mode-normal" class="btn-main btn-toggle active-mode" onclick="setMode('normal')">NORMAL (Find Answer)</button>
            <button id="mode-reversed" class="btn-main btn-toggle" onclick="setMode('reversed')">REVERSED (Find Word)</button>
        </div>

        <button class="btn-main" style="background:#e74c3c; font-size: 1.4rem; padding: 20px 40px;" onclick="document.getElementById('file-input').click()">CHOOSE FILE & START</button>
        <input type="file" id="file-input" style="display:none" accept=".json,.txt">
    </div>

    <div id="win-screen" class="full-screen" style="display:none">
        <h1 style="font-size: 3.5rem;">YOU ARE A MASTER! 🎉</h1>
        <button class="btn-main" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
    // Giữ nguyên phần logic JavaScript của bạn
    const state = {
        vocab: [],
        currentIndex: 0,
        mistakes: 0,
        gameActive: false,
        mode: 'normal',
        lanes: [
            { id: 'lane-1', speed: 3.5, dir: 1, lastSpawn: 0, spawnRate: 1800 },
            { id: 'lane-2', speed: 4.8, dir: -1, lastSpawn: 0, spawnRate: 1400 },
            { id: 'lane-3', speed: 6.5, dir: 1, lastSpawn: 0, spawnRate: 1000 }
        ],
        activeWords: [],
        inputLocked: false
    };

    function setMode(m) {
        state.mode = m;
        document.getElementById('mode-normal').classList.toggle('active-mode', m === 'normal');
        document.getElementById('mode-reversed').classList.toggle('active-mode', m === 'reversed');
    }

    const fileInput = document.getElementById('file-input');
    const targetDisplay = document.getElementById('target-display');

    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const content = event.target.result;
            try {
                if (file.name.endsWith('.json')) {
                    const data = JSON.parse(content);
                    state.vocab = data.map(item => ({ word: item.en, answer: item.url, isImage: true }));
                } else {
                    const lines = content.split(/\r?\n/).map(l => l.trim()).filter(l => l !== "");
                    state.vocab = [];
                    for(let i=0; i < lines.length; i+=2) {
                        if(lines[i+1]) state.vocab.push({ word: lines[i], answer: lines[i+1], isImage: false });
                    }
                }
                startGame();
            } catch (err) { alert("Format error!"); }
        };
        reader.readAsText(file);
    };

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        state.gameActive = true;
        updateUI();
        requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        const current = state.vocab[state.currentIndex];
        if (state.mode === 'normal') {
            targetDisplay.innerText = current.word;
        } else {
            targetDisplay.innerHTML = current.isImage ? `<img src="${current.answer}">` : `<span>${current.answer}</span>`;
        }
        document.getElementById('mistake-counter').innerText = `MISTAKES: ${state.mistakes}/5`;
    }

    function spawnWord(laneIndex) {
        const laneCfg = state.lanes[laneIndex];
        const isCorrect = Math.random() < 0.3;
        const data = isCorrect ? state.vocab[state.currentIndex] : state.vocab[Math.floor(Math.random() * state.vocab.length)];

        const el = document.createElement('div');
        el.className = 'word-bubble';
        
        if (state.mode === 'normal') {
            el.innerHTML = data.isImage ? `<img src="${data.answer}">` : `<span>${data.answer}</span>`;
        } else {
            el.innerHTML = `<span>${data.word}</span>`;
        }

        document.getElementById(laneCfg.id).appendChild(el);

        const wordObj = {
            el, x: laneCfg.dir === 1 ? -250 : window.innerWidth + 50,
            y: Math.random() * (window.innerHeight * 0.2 - 80),
            speed: laneCfg.speed * laneCfg.dir,
            val: state.mode === 'normal' ? data.answer : data.word
        };

        el.style.top = `${wordObj.y}px`;
        el.onclick = (ev) => handlePick(wordObj, ev);
        state.activeWords.push(wordObj);
    }

    function handlePick(obj, ev) {
        if (!state.gameActive || state.inputLocked) return;
        state.inputLocked = true;
        setTimeout(() => state.inputLocked = false, 150);

        const targetVal = state.mode === 'normal' ? state.vocab[state.currentIndex].answer : state.vocab[state.currentIndex].word;

        if (obj.val === targetVal) {
            createEmojiBurst(ev.clientX, ev.clientY);
            flash('rgba(46, 204, 113, 0.4)');
            obj.el.remove();
            state.activeWords = state.activeWords.filter(w => w !== obj);
            state.currentIndex++;
            if (state.currentIndex >= state.vocab.length) win();
            else updateUI();
        } else {
            state.mistakes++;
            flash('rgba(231, 76, 60, 0.6)');
            updateUI();
            showFailGif();
            if (state.mistakes >= 5) setTimeout(() => location.reload(), 2000);
        }
    }

    function createEmojiBurst(x, y) {
        const emojis = ['⚡', '🔥', '💎', '🎯', '🚀'];
        for (let i = 0; i < 10; i++) {
            const span = document.createElement('span');
            span.className = 'emoji-burst';
            span.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = `${x}px`; span.style.top = `${y}px`;
            span.style.setProperty('--tx', `${(Math.random() - 0.5) * 300}px`);
            span.style.setProperty('--ty', `${(Math.random() - 0.5) * 300}px`);
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 700);
        }
    }

    function showFailGif() {
        const gif = document.getElementById('fail-overlay-gif');
        gif.style.display = 'block';
        state.gameActive = false;
        setTimeout(() => {
            gif.style.display = 'none';
            if(state.mistakes < 5) state.gameActive = true;
        }, 1200);
    }

    function gameLoop(time) {
        if (!state.gameActive) { requestAnimationFrame(gameLoop); return; }

        state.lanes.forEach((lane, idx) => {
            if (time - lane.lastSpawn > lane.spawnRate) {
                spawnWord(idx);
                lane.lastSpawn = time;
            }
        });

        for (let i = state.activeWords.length - 1; i >= 0; i--) {
            const w = state.activeWords[i];
            w.x += w.speed;
            w.el.style.transform = `translateX(${w.x}px)`;
            if ((w.speed > 0 && w.x > window.innerWidth + 250) || (w.speed < 0 && w.x < -350)) {
                w.el.remove();
                state.activeWords.splice(i, 1);
            }
        }
        requestAnimationFrame(gameLoop);
    }

    function flash(color) {
        const f = document.getElementById('flash-overlay');
        f.style.background = color; f.style.opacity = '1';
        setTimeout(() => f.style.opacity = '0', 150);
    }

    function win() {
        state.gameActive = false;
        document.getElementById('win-screen').style.display = 'flex';
    }
</script>
</body>
</html>
