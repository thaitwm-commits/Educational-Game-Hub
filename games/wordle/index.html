<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mocha Wordle</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121213; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        h1 { margin: 10px 0; letter-spacing: 4px; }
        
        /* CÁC NÚT ĐIỀU KHIỂN */
        #resetBtn { position: absolute; top: 15px; left: 15px; width: 40px; cursor: pointer; }
        #muteBtn { position: absolute; top: 15px; right: 15px; width: 40px; cursor: pointer; opacity: 0.8; transition: opacity 0.3s; }
        #muteBtn:hover { opacity: 1; }
        
        /* PHẦN HIỂN THỊ TÊN NHẠC */
        #attribution { font-size: 12px; color: #a0a0a0; font-style: italic; margin-top: -5px; height: 15px; text-align: center; }

        #grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .tile { width: clamp(45px, 10vw, 65px); height: clamp(45px, 10vw, 65px); border: 2px solid #3a3a3c; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold; text-transform: uppercase; }
        .correct { background: #6aaa64; border-color: #6aaa64; }
        .present { background: #c9b458; border-color: #c9b458; }
        .absent { background: #3a3a3c; border-color: #3a3a3c; }
        #keyboard { margin-top: 20px; }
        .keyrow { display: flex; justify-content: center; }
        .key { background: #818384; border: none; margin: 3px; padding: 10px; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; min-width: 30px; }
        .key.correct { background: #6aaa64; }
        .key.present { background: #c9b458; }
        .key.absent { background: #3a3a3c; }
        #message { height: 30px; margin: 10px; font-weight: bold; color: #ff4d4d; z-index: 10; }
        
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.4);
            transition: background-image 0.5s ease-in-out;
        }
    </style>
</head>
<body>

<div id="bg-overlay"></div>
<img id="resetBtn" src="https://cdn-icons-png.flaticon.com/128/16586/16586062.png" alt="Reset">

<img id="muteBtn" src="https://cdn-icons-png.flaticon.com/128/727/727240.png" alt="Mute">

<h1>WORDLE</h1>

<div id="attribution"></div>

<audio id="bg-audio"></audio>

<div id="message"></div>
<div id="grid"></div>
<div id="keyboard"></div>

<script>
    // LOGIC NHẠC
    const playlist = [
        { src: "ambience1.mp3", title: "honey jam - massobeats" },
        { src: "ambience3.mp3", title: "lavender - massobeats" },
        { src: "ambience4.mp3", title: "cotton cloud - fatb" }
    ];
    let currentTrackIndex = 0;
    let isMusicPlaying = false;
    
    const audioPlayer = document.getElementById("bg-audio");
    const attributionText = document.getElementById("attribution");
    const muteBtn = document.getElementById("muteBtn");
    
    // ORI: 8% REMEMBER SUCKER
    audioPlayer.volume = 0.08; 
    
    // Tải bài hát
    function loadTrack(index) {
        audioPlayer.src = playlist[index].src;
        attributionText.innerText = `♪ ${playlist[index].title}`;
    }
    loadTrack(currentTrackIndex);

    // Chuyển bài 
    audioPlayer.addEventListener("ended", () => {
        currentTrackIndex = (currentTrackIndex + 1) % playlist.length; // Loop lại nếu hết mảng
        loadTrack(currentTrackIndex);
        audioPlayer.play();
    });

    // Bật tắt nhạc 
    muteBtn.onclick = () => {
        if (isMusicPlaying) {
            audioPlayer.pause();
            isMusicPlaying = false;
            muteBtn.src = "https://cdn-icons-png.flaticon.com/128/727/727240.png"; // Icon tắt loa
        } else {
            audioPlayer.play().catch(e => console.log("Need interaction:", e));
            isMusicPlaying = true;
            muteBtn.src = "https://cdn-icons-png.flaticon.com/128/728/728099.png"; // Icon mở loa
        }
    };
    // --- PHẦN LOGIC NHẠC KẾT THÚC ---


    // EASTER EGG FOR BALL CANCER
    let WORDS = ["DEVIL", "ERROR", "HUNTED", "DEATH", "PENIS"];
    
    let target;
    let currentRow;
    let currentCol;
    let board;
    let isGameOver = false;

    const BG_GIFS = [
        "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUyNHA4MGptZXUzc2EyZXJkeTJxajdxeWQyd3I5NXB6aXE3N3YwOHg0aiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KuFERqzDb0pxe/giphy.gif", 
        "https://i.pinimg.com/originals/ee/35/77/ee35770131dc97a83e2131676397a144.gif",
        "https://animesher.com/orig/2/205/2057/20574/animesher.com_cafe-vaporwave-80s-2057444.gif", 
        "https://i.pinimg.com/originals/08/55/91/0855918ef559bc162b96419989e67642.gif"
    ];

    function changeBackground() {
        const randomGif = BG_GIFS[Math.floor(Math.random() * BG_GIFS.length)];
        document.getElementById('bg-overlay').style.backgroundImage = `url('${randomGif}')`;
    }

    const grid = document.getElementById("grid");
    const keyboard = document.getElementById("keyboard");
    const message = document.getElementById("message");

    // HÀM TẢI LIST TXT
    async function loadWords() {
        try {
            const response = await fetch('list.txt');
            if (!response.ok) throw new Error("Failed to load list.txt");
            const text = await response.text();
            
            const externalWords = text.split(/\r?\n|,/)
                .map(w => w.trim().toUpperCase())
                .filter(w => w.length === 5);

            if (externalWords.length > 0) {
                WORDS = externalWords;
                console.log("Words loaded:", WORDS.length);
            }
        } catch (error) {
            console.error("Error loading wordlist:", error);
            showMessage("Using fallback wordlist");
        }
        startGame();
    }

    function startGame() {
        changeBackground(); 
        target = WORDS[Math.floor(Math.random() * WORDS.length)];
        currentRow = 0;
        currentCol = 0;
        isGameOver = false;
        board = Array(6).fill().map(() => Array(5).fill(""));

        grid.innerHTML = "";
        keyboard.innerHTML = "";
        message.innerText = "";

        createGrid();
        createKeyboard();
    }

    function createGrid() {
        for (let r = 0; r < 6; r++) {
            let rowDiv = document.createElement("div");
            rowDiv.className = "row";
            for (let c = 0; c < 5; c++) {
                let tile = document.createElement("div");
                tile.className = "tile";
                tile.id = `tile-${r}-${c}`;
                rowDiv.appendChild(tile);
            }
            grid.appendChild(rowDiv);
        }
    }

    function createKeyboard() {
        const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
        rows.forEach(line => {
            let rowDiv = document.createElement("div");
            rowDiv.className = "keyrow";
            if (line === "ZXCVBNM") addKey(rowDiv, "ENTER");
            for (let letter of line) addKey(rowDiv, letter);
            if (line === "ZXCVBNM") addKey(rowDiv, "DEL");
            keyboard.appendChild(rowDiv);
        });
    }

    function addKey(rowDiv, letter) {
        let key = document.createElement("button");
        key.innerText = letter;
        key.className = "key";
        key.dataset.key = letter;
        key.onclick = () => pressKey(letter);
        rowDiv.appendChild(key);
    }

    function pressKey(letter) {
        if (isGameOver) return;

        // Auto-play music hj
        if (!isMusicPlaying && audioPlayer.paused) {
            audioPlayer.play().then(() => {
                isMusicPlaying = true;
                muteBtn.src = "https://cdn-icons-png.flaticon.com/128/728/728099.png";
            }).catch(e => console.log(e));
        }

        if (letter === "DEL") {
            if (currentCol > 0) {
                currentCol--;
                board[currentRow][currentCol] = "";
                updateTile(currentRow, currentCol, "");
            }
            return;
        }

        if (letter === "ENTER") {
            submitGuess();
            return;
        }

        if (currentCol < 5 && letter.length === 1 && letter.match(/[A-Z]/)) {
            board[currentRow][currentCol] = letter;
            updateTile(currentRow, currentCol, letter);
            currentCol++;
        }
    }

    function updateTile(r, c, letter) {
        document.getElementById(`tile-${r}-${c}`).innerText = letter;
    }

    function submitGuess() {
        if (currentCol < 5) {
            showMessage("Not enough letters");
            return;
        }

        let guess = board[currentRow].join("");

        if (!WORDS.includes(guess)) {
            showMessage("Not in word list");
            return;
        }

        checkGuess(guess);

        if (guess === target) {
            showMessage("You win!");
            isGameOver = true;
            return;
        }

        currentRow++;
        currentCol = 0;

        if (currentRow === 6) {
            showMessage("The word was: " + target);
            isGameOver = true;
        }
    }

    function checkGuess(guess) {
        let targetArr = target.split("");
        let guessArr = guess.split("");

        for (let i = 0; i < 5; i++) {
            let tile = document.getElementById(`tile-${currentRow}-${i}`);
            if (guessArr[i] === targetArr[i]) {
                tile.classList.add("correct");
                updateKeyColor(guessArr[i], "correct");
                targetArr[i] = null;
                guessArr[i] = null;
            }
        }

        for (let i = 0; i < 5; i++) {
            if (guessArr[i] === null) continue;
            let tile = document.getElementById(`tile-${currentRow}-${i}`);
            let indexInTarget = targetArr.indexOf(guessArr[i]);
            
            if (indexInTarget !== -1) {
                tile.classList.add("present");
                updateKeyColor(guessArr[i], "present");
                targetArr[indexInTarget] = null;
            } else {
                tile.classList.add("absent");
                updateKeyColor(guessArr[i], "absent");
            }
        }
    }

    function updateKeyColor(letter, state) {
        const key = document.querySelector(`[data-key='${letter}']`);
        if (!key) return;
        if (state === "correct") {
            key.className = "key correct";
        } else if (state === "present" && !key.classList.contains("correct")) {
            key.className = "key present";
        } else if (state === "absent" && !key.classList.contains("correct") && !key.classList.contains("present")) {
            key.className = "key absent";
        }
    }

    function showMessage(msg) {
        message.innerText = msg;
        if (msg !== "You win!" && !msg.startsWith("The word was")) {
            setTimeout(() => { if (message.innerText === msg) message.innerText = ""; }, 2000);
        }
    }

    document.addEventListener("keydown", (e) => {
        let key = e.key.toUpperCase();
        if (key === "BACKSPACE") pressKey("DEL");
        else if (key === "ENTER") pressKey("ENTER");
        else if (key.length === 1 && key.match(/[A-Z]/)) pressKey(key);
    });

    document.getElementById("resetBtn").onclick = startGame;

    loadWords();

</script>
</body>
</html>
