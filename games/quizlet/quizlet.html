<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flashcards</title>
    <style>
        /* Base Reset & Background */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://preview.redd.it/pikmin-desktop-background-v0-gt74wk1czewd1.png?width=640&crop=smart&auto=webp&s=9078341122432f3c436d7fdfb328c1900fb5a46c');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4); /* Chỉnh tối thêm một chút để dễ nhìn chữ */
            z-index: -1;
        }

        /* Progress Bar */
        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: none;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #6aaa64;
            transition: width 0.3s ease;
        }

        /* Glassmorphism Card UI */
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Start Screen (File Upload & Modes) */
        #startScreen h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 1rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
        }
        
        #startScreen p {
            margin-bottom: 1.5rem;
            color: #eee;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .mode-toggle input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .upload-btn {
            display: inline-block;
            background: rgba(106, 170, 100, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1rem 2rem;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: rgba(106, 170, 100, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(106, 170, 100, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        /* Game Elements */
        #gameCard {
            display: none;
        }

        #timerDisplay {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffca28;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            display: none; /* Hidden unless FunCMode is ON */
        }

        #question {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
        }

        /* 2x2 Answer Grid */
        #choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        button.choice {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1.2rem 1rem;
            color: white;
            font-size: clamp(1rem, 3vw, 1.2rem);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        button.choice:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        button.choice:disabled {
            cursor: default;
        }

        /* IDK Button */
        #idkBtn {
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.8rem 2rem;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        #idkBtn img {
            width: 24px;
            height: 24px;
            filter: invert(1); /* Đổi màu icon đen thành trắng để nổi trên nền tối */
        }

        #idkBtn:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.5);
        }

        #idkBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        /* Feedback States */
        button.choice.correct {
            background: #6aaa64 !important;
            border-color: #6aaa64 !important;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(106, 170, 100, 0.4);
        }

        button.choice.wrong {
            background: #e95d5d !important;
            border-color: #e95d5d !important;
            opacity: 0.8;
        }

        /* End Screen */
        #endScreen { display: none; }
        #endScreen h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 1rem;
            color: #6aaa64;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div id="progressBar">
        <div id="progressFill"></div>
    </div>

    <div class="card" id="startScreen">
        <h1>Smart Flashcards</h1>
        <p>Select your .txt deck to begin.</p>
        
        <label class="mode-toggle">
            <input type="checkbox" id="funModeCheck">
            <span>⚡ FunCMode (20 words, 5s/turn)</span>
        </label>

        <label class="upload-btn">
            Choose File
            <input type="file" id="fileInput" accept=".txt">
        </label>
    </div>

    <div class="card" id="gameCard">
        <div id="gameContainer">
            <div id="timerDisplay">⏱️ 5s</div>
            <div id="question">Loading...</div>
            <div id="choices"></div>
            
            <button id="idkBtn" onclick="handleIdk()">
                <img src="https://cdn-icons-png.flaticon.com/128/19025/19025442.png" alt="IDK"> 
                I Don't Know
            </button>
        </div>

        <div id="endScreen">
            <h1>🎉 Completed!</h1>
            <div class="stat-box">
                <div class="stat-label">Total Mistakes</div>
                <div class="stat-value" id="totalMistakes">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Hardest Word</div>
                <div class="stat-value" id="hardestWord">-</div>
            </div>
        </div>
    </div>

    <script>
        // State Variables
        let allQuestions = [];
        let activeQuestions = [];
        let allAnswers = [];
        let errorMap = {};
        let currentQuestion = null;
        let totalWords = 0;
        
        // FunCMode Variables
        let isFunMode = false;
        let timerInterval = null;
        let timeLeft = 5;

        // --- FILE UPLOAD LOGIC ---
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            isFunMode = document.getElementById('funModeCheck').checked;

            const reader = new FileReader();
            reader.onload = function(event) {
                const textData = event.target.result;
                startGame(textData);
            };
            reader.readAsText(file);
        });

        function startGame(rawData) {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameCard').style.display = 'block';
            document.getElementById('progressBar').style.display = 'block';

            if (isFunMode) {
                document.getElementById('timerDisplay').style.display = 'block';
            }

            const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            
            for (let i = 0; i < lines.length; i += 2) {
                const q = lines[i];
                const a = lines[i + 1];
                if (q && a) {
                    allQuestions.push({ q, a });
                    allAnswers.push(a); // Lưu TẤT CẢ các đáp án để random
                    errorMap[q] = 0;
                }
            }
            
            if (allQuestions.length === 0) {
                alert("File empty or formatting incorrect. Please refresh and try again.");
                return;
            }

            allAnswers = [...new Set(allAnswers)];

            // Xử lý logic FunCMode: random 20 từ
            if (isFunMode) {
                allQuestions.sort(() => Math.random() - 0.5);
                activeQuestions = allQuestions.slice(0, 20);
            } else {
                activeQuestions = [...allQuestions];
            }

            totalWords = activeQuestions.length;
            loadNextQuestion();
        }

        // --- CORE GAME LOGIC ---

        function pickSmartQuestion() {
            let totalWeight = 0;
            let cumulativeWeights = [];

            for (let i = 0; i < activeQuestions.length; i++) {
                let weight = 1 + errorMap[activeQuestions[i].q];
                totalWeight += weight;
                cumulativeWeights.push(totalWeight);
            }

            let randomVal = Math.random() * totalWeight;
            
            for (let i = 0; i < cumulativeWeights.length; i++) {
                if (randomVal < cumulativeWeights[i]) {
                    return activeQuestions[i];
                }
            }
            return activeQuestions[0];
        }

        function updateProgress() {
            const completed = totalWords - activeQuestions.length;
            const percentage = (completed / totalWords) * 100;
            document.getElementById('progressFill').style.width = `${percentage}%`;
        }

        function startTimer() {
            clearInterval(timerInterval);
            if (!isFunMode) return;

            timeLeft = 5;
            document.getElementById('timerDisplay').innerText = `⏱️ ${timeLeft}s`;
            
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `⏱️ ${timeLeft}s`;
                
                if (timeLeft <= 0) {
                    handleTimeout();
                }
            }, 1000);
        }

        function loadNextQuestion() {
            updateProgress();

            if (activeQuestions.length === 0) {
                showEndScreen();
                return;
            }

            // Kích hoạt lại nút IDK
            document.getElementById('idkBtn').disabled = false;

            currentQuestion = pickSmartQuestion();
            document.getElementById('question').innerText = currentQuestion.q;

            let choices = [currentQuestion.a];
            
            while (choices.length < 4 && choices.length < allAnswers.length) {
                let randomAnswer = allAnswers[Math.floor(Math.random() * allAnswers.length)];
                if (!choices.includes(randomAnswer)) {
                    choices.push(randomAnswer);
                }
            }

            choices.sort(() => Math.random() - 0.5);

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            
            choices.forEach(choiceText => {
                const btn = document.createElement('button');
                btn.className = 'choice';
                btn.innerText = choiceText;
                btn.onclick = () => checkAnswer(btn, choiceText);
                choicesContainer.appendChild(btn);
            });

            startTimer(); // Bắt đầu đếm giờ nếu ở FunCMode
        }

        // Vô hiệu hóa tất cả các nút (để ko bấm spam)
        function disableAllButtons() {
            clearInterval(timerInterval);
            document.querySelectorAll('.choice').forEach(btn => btn.disabled = true);
            document.getElementById('idkBtn').disabled = true;
        }

        // Highlight đáp án đúng
        function highlightCorrectAnswer() {
            document.querySelectorAll('.choice').forEach(btn => {
                if (btn.innerText === currentQuestion.a) {
                    btn.classList.add('correct');
                }
            });
        }

        function checkAnswer(selectedBtn, selectedText) {
            disableAllButtons();
            const isCorrect = selectedText === currentQuestion.a;

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                activeQuestions = activeQuestions.filter(item => item.q !== currentQuestion.q);
            } else {
                selectedBtn.classList.add('wrong');
                highlightCorrectAnswer();
                errorMap[currentQuestion.q]++;
            }

            setTimeout(() => { loadNextQuestion(); }, 1200);
        }

        // Nút IDK xử lý như đoán sai
        function handleIdk() {
            disableAllButtons();
            highlightCorrectAnswer();
            errorMap[currentQuestion.q]++;
            
            setTimeout(() => { loadNextQuestion(); }, 1200);
        }

        // Hết giờ trong chế độ FunCMode cũng tính như sai/IDK
        function handleTimeout() {
            disableAllButtons();
            document.getElementById('timerDisplay').innerText = `⏳ Time's up!`;
            highlightCorrectAnswer();
            errorMap[currentQuestion.q]++;
            
            setTimeout(() => { loadNextQuestion(); }, 1500); // Đợi lâu hơn xíu cho người dùng nhìn
        }

        function showEndScreen() {
            clearInterval(timerInterval);
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('endScreen').style.display = 'block';
            document.getElementById('progressFill').style.width = '100%';

            let totalMistakes = 0;
            let hardestWord = "None!";
            let maxErrors = 0;

            for (const [word, errors] of Object.entries(errorMap)) {
                totalMistakes += errors;
                if (errors > maxErrors) {
                    maxErrors = errors;
                    hardestWord = `${word} (${errors} mistakes)`;
                }
            }

            document.getElementById('totalMistakes').innerText = totalMistakes;
            
            if (totalMistakes === 0) {
                document.getElementById('hardestWord').innerText = "Perfect Score! 🌟";
            } else {
                document.getElementById('hardestWord').innerText = hardestWord;
            }
        }
    </script>
</body>
</html>
