<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Flashcards</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Group các nút điều hướng ở góc trên bên phải */
        .top-controls {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        #bgToggle, #btn-switch-flashcard {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.85rem;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s;
        }
        
        #bgToggle:hover, #btn-switch-flashcard:hover {
            background: rgba(0,0,0,0.6);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('https://www.thisiscolossal.com/wp-content/uploads/2026/03/waider-1.gif');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        #progressBar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
            display: none;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #6aaa64;
            transition: width 0.3s ease;
        }

        .break-marker {
            position: absolute;
            top: 0;
            height: 100%;
            width: 4px;
            background: #ffca28;
            z-index: 11;
            transform: translateX(-50%);
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 95%;
            max-width: 820px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #startScreen h1 {
            font-size: clamp(2rem, 5vw, 2.5rem);
            margin-bottom: 1rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
        }
        
        #startScreen p {
            margin-bottom: 1.5rem;
            color: #eee;
        }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .mode-selector label {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .mode-selector label:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .mode-selector input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .upload-btn {
            display: inline-block;
            background: rgba(106, 170, 100, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 1rem 2rem;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .upload-btn:hover {
            background: rgba(106, 170, 100, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(106, 170, 100, 0.4);
        }

        input[type="file"] {
            display: none;
        }

        #gameCard, #studyContainer, #breakScreen {
            display: none;
        }

        #timerDisplay {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffca28;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            display: none; 
        }

        #question, #studyQuestion {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.4);
            line-height: 1.5;
        }

        #studyAnswer {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #ffca28;
            margin-bottom: 2.5rem;
            font-weight: bold;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 8px;
            line-height: 1.5;
        }

        #choices {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        button.choice, .nav-btns button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12rem 1rem;
            padding: 1.2rem 1rem;
            color: white;
            font-size: clamp(0.85rem, 2vw, 1rem);
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            text-align: left;
            line-height: 1.4;
        }

        button.choice:hover:not(:disabled), .nav-btns button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        button.choice:disabled, .nav-btns button:disabled {
            cursor: default;
            opacity: 0.5;
            transform: none;
        }

        .nav-btns {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
        }

        .nav-btns button {
            flex: 1;
            text-align: center;
        }

        #idkBtn {
            margin-top: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0.8rem 2rem;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
        }

        #idkBtn img {
            width: 24px;
            height: 24px;
            filter: invert(1);
        }

        #idkBtn:hover:not(:disabled) {
            background: rgba(0, 0, 0, 0.5);
        }

        #idkBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        button.choice.correct {
            background: #6aaa64 !important;
            border-color: #6aaa64 !important;
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(106, 170, 100, 0.4);
        }

        button.choice.wrong {
            background: #e95d5d !important;
            border-color: #e95d5d !important;
            opacity: 0.8;
        }

        #endScreen { display: none; }
        #endScreen h1 {
            font-size: clamp(2rem, 6vw, 3rem);
            margin-bottom: 1rem;
            color: #6aaa64;
        }
        
        #breakScreen h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: #ffca28;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ccc;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="top-controls">
        <button id="btn-switch-flashcard" onclick="window.location.href='../quizlet.html'">
            🔀 Shuffle mode
        </button>
        <button id="bgToggle" onclick="toggleBg()">🖼️ BG: ON</button>
    </div>

    <div class="overlay"></div>

    <div id="progressBar">
        <div id="progressFill"></div>
    </div>

    <div class="card" id="startScreen">
        <h1>Smart Flashcards</h1>
        <p>Select mode and deck to begin.</p>
        
        <div class="mode-selector">
            <label><input type="radio" name="gameMode" value="normal" checked> Normal Mode</label>
            <label><input type="radio" name="gameMode" value="study"> 📚 Study Mode</label>
            <label><input type="radio" name="gameMode" value="fun"> ⚡ Fun Mode (20 câu, 5s)</label>
        </div>

        <label class="upload-btn">
            Choose File
            <input type="file" id="fileInput" accept=".txt">
        </label>
    </div>

    <div class="card" id="gameCard">
        <div id="gameContainer">
            <div id="timerDisplay">⏱️ 5s</div>
            <div id="question">Loading...</div>
            <div id="choices"></div>
            
            <button id="idkBtn" onclick="handleIdk()">
                <img src="https://cdn-icons-png.flaticon.com/128/19025/19025442.png" alt="IDK"> 
                I Don't Know
            </button>
        </div>

        <div id="studyContainer">
            <div id="studyQuestion">Loading...</div>
            <div id="studyAnswer">Loading...</div>
            <div class="nav-btns">
                <button id="prevBtn" onclick="prevStudy()">← Previous</button>
                <button id="nextBtn" onclick="nextStudy()">Next →</button>
            </div>
        </div>

        <div id="breakScreen">
            <h2>☕ Break time!</h2>
            <button class="upload-btn" onclick="resumeAfterBreak()">Are you ready?</button>
        </div>

        <div id="endScreen">
            <h1>🎉 Completed!</h1>
            <div class="stat-box">
                <div class="stat-label">Total Mistakes</div>
                <div class="stat-value" id="totalMistakes">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Hardest Question</div>
                <div class="stat-value" id="hardestWord">-</div>
            </div>
        </div>
    </div>

    <script>
        // ── Toggle background ──────────────────────────────────────
        function toggleBg() {
            const btn = document.getElementById('bgToggle');
            const isOn = document.body.style.backgroundImage !== 'none';
            if (isOn) {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = '#1a1a2e';
                btn.textContent = '🖼️ BG: OFF';
            } else {
                document.body.style.backgroundImage = "url('https://www.thisiscolossal.com/wp-content/uploads/2026/03/waider-1.gif')";
                document.body.style.backgroundColor = '';
                btn.textContent = '🖼️ BG: ON';
            }
        }

        // ── State ──────────────────────────────────────────────────
        let allQuestions   = [];   // { q, correct, choices[4] }
        let activeQuestions = [];
        let errorMap       = {};
        let currentQuestion = null;
        let totalWords     = 0;

        let currentMode    = 'normal';
        let timerInterval  = null;
        let timeLeft       = 5;
        let studyIndex     = 0;
        let seenBreaks     = new Set();

        // ── File input ─────────────────────────────────────────────
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const modeRadios = document.getElementsByName('gameMode');
            for (const radio of modeRadios) {
                if (radio.checked) currentMode = radio.value;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                startGame(event.target.result);
            };
            reader.readAsText(file);
        });

        // ── Parse file: nhóm 5 dòng ───────────────────────────────
        function parseFile(rawData) {
            const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const questions = [];

            for (let i = 0; i + 4 < lines.length; i += 5) {
                const q       = lines[i];
                const correct = lines[i + 1];   // A – luôn là đáp án đúng
                const b       = lines[i + 2];
                const c       = lines[i + 3];
                const d       = lines[i + 4];

                questions.push({
                    q,
                    correct,
                    choices: [correct, b, c, d]  // sẽ được xáo khi hiển thị
                });

                errorMap[q] = 0;
            }
            return questions;
        }

        // ── Start game ─────────────────────────────────────────────
        function startGame(rawData) {
            allQuestions    = [];
            activeQuestions = [];
            errorMap        = {};
            seenBreaks.clear();

            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameCard').style.display    = 'block';
            document.getElementById('progressBar').style.display = 'block';

            allQuestions = parseFile(rawData);

            if (allQuestions.length === 0) {
                alert("File trống hoặc sai định dạng. Mỗi câu cần đúng 5 dòng:\nCâu hỏi\nA (đúng)\nB\nC\nD");
                return;
            }

            if (currentMode === 'fun') {
                allQuestions.sort(() => Math.random() - 0.5);
                activeQuestions = allQuestions.slice(0, 20);
                document.getElementById('timerDisplay').style.display = 'block';
            } else {
                activeQuestions = [...allQuestions];
            }

            totalWords = activeQuestions.length;
            drawBreakMarkers();

            if (currentMode === 'study') {
                document.getElementById('gameContainer').style.display   = 'none';
                document.getElementById('studyContainer').style.display  = 'block';
                studyIndex = 0;
                loadStudyQuestion();
            } else {
                document.getElementById('studyContainer').style.display  = 'none';
                document.getElementById('gameContainer').style.display   = 'block';
                loadNextQuestion();
            }
        }

        // ── Progress bar & break markers ──────────────────────────
        function drawBreakMarkers() {
            document.querySelectorAll('.break-marker').forEach(e => e.remove());
            const numBreaks = Math.floor(totalWords / 15);
            for (let i = 1; i <= numBreaks; i++) {
                if (i * 15 >= totalWords) continue;
                const marker = document.createElement('div');
                marker.className  = 'break-marker';
                marker.style.left = `${(i * 15 / totalWords) * 100}%`;
                document.getElementById('progressBar').appendChild(marker);
            }
        }

        // ── Break / Resume logic ───────────────────────────────────
        function checkBreak(completed, resumeCallback) {
            if (completed % 15 === 0 && completed !== 0 && completed !== totalWords && !seenBreaks.has(completed)) {
                seenBreaks.add(completed);
                clearInterval(timerInterval);
                document.getElementById('gameContainer').style.display  = 'none';
                document.getElementById('studyContainer').style.display = 'none';
                document.getElementById('breakScreen').style.display    = 'block';
                window.resumeCallback = resumeCallback;
                return true;
            }
            return false;
        }

        function resumeAfterBreak() {
            document.getElementById('breakScreen').style.display = 'none';
            if (currentMode === 'study') {
                document.getElementById('studyContainer').style.display = 'block';
            } else {
                document.getElementById('gameContainer').style.display = 'block';
                if (currentMode === 'fun') startTimer();
            }
            if (window.resumeCallback) window.resumeCallback();
        }

        // ── Study mode ─────────────────────────────────────────────
        function loadStudyQuestion() {
            if (studyIndex >= totalWords) { showEndScreen(); return; }
            document.getElementById('progressFill').style.width = `${(studyIndex / totalWords) * 100}%`;
            const item = activeQuestions[studyIndex];
            document.getElementById('studyQuestion').innerText = item.q;
            document.getElementById('studyAnswer').innerText =
                ` ${item.correct}\n\nCác lựa chọn:\n${item.choices.map((c,i)=>String.fromCharCode(65+i)+') '+c).join('\n')}`;
            document.getElementById('prevBtn').disabled = (studyIndex === 0);
        }

        function nextStudy() {
            studyIndex++;
            if (checkBreak(studyIndex, loadStudyQuestion)) return;
            loadStudyQuestion();
        }

        function prevStudy() {
            if (studyIndex > 0) studyIndex--;
            loadStudyQuestion();
        }

        // ── Quiz mode helpers ──────────────────────────────────────
        function pickSmartQuestion() {
            let totalWeight = 0;
            const cumulativeWeights = [];
            for (const item of activeQuestions) {
                totalWeight += 1 + errorMap[item.q];
                cumulativeWeights.push(totalWeight);
            }
            const rand = Math.random() * totalWeight;
            for (let i = 0; i < cumulativeWeights.length; i++) {
                if (rand < cumulativeWeights[i]) return activeQuestions[i];
            }
            return activeQuestions[0];
        }

        function updateProgress() {
            const completed = totalWords - activeQuestions.length;
            document.getElementById('progressFill').style.width = `${(completed / totalWords) * 100}%`;
        }

        // ── Timer (Fun mode) ───────────────────────────────────────
        function startTimer() {
            clearInterval(timerInterval);
            if (currentMode !== 'fun') return;
            timeLeft = 5;
            document.getElementById('timerDisplay').innerText = `⏱️ ${timeLeft}s`;
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `⏱️ ${timeLeft}s`;
                if (timeLeft <= 0) handleTimeout();
            }, 1000);
        }

        // ── Load question (Quiz & Fun) ─────────────────────────────
        function loadNextQuestion() {
            updateProgress();
            if (activeQuestions.length === 0) { showEndScreen(); return; }

            document.getElementById('idkBtn').disabled = false;
            currentQuestion = pickSmartQuestion();
            document.getElementById('question').innerText = currentQuestion.q;

            const shuffled = [...currentQuestion.choices].sort(() => Math.random() - 0.5);

            const container = document.getElementById('choices');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D'];
            shuffled.forEach((text, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice';
                btn.innerText = `${labels[idx]}) ${text}`;
                btn.dataset.value = text;
                btn.onclick = () => checkAnswer(btn, text);
                container.appendChild(btn);
            });

            startTimer();
        }

        // ── Answer logic ───────────────────────────────────────────
        function disableAllButtons() {
            clearInterval(timerInterval);
            document.querySelectorAll('.choice').forEach(btn => btn.disabled = true);
            document.getElementById('idkBtn').disabled = true;
        }

        function highlightCorrectAnswer() {
            document.querySelectorAll('.choice').forEach(btn => {
                if (btn.dataset.value === currentQuestion.correct) {
                    btn.classList.add('correct');
                }
            });
        }

        // Sửa lỗi lặp dòng padding ở class button.choice (CSS) trong file gốc của bạn đã được dọn sạch
        function checkAnswer(selectedBtn, selectedText) {
            disableAllButtons();
            if (selectedText === currentQuestion.correct) {
                selectedBtn.classList.add('correct');
                activeQuestions = activeQuestions.filter(item => item.q !== currentQuestion.q);
            } else {
                selectedBtn.classList.add('wrong');
                highlightCorrectAnswer();
                errorMap[currentQuestion.q]++;
            }
            setTimeout(() => {
                const completed = totalWords - activeQuestions.length;
                if (checkBreak(completed, loadNextQuestion)) return;
                loadNextQuestion();
            }, 1200);
        }

        function handleIdk() {
            disableAllButtons();
            highlightCorrectAnswer();
            errorMap[currentQuestion.q]++;
            setTimeout(() => { loadNextQuestion(); }, 1200);
        }

        function handleTimeout() {
            disableAllButtons();
            document.getElementById('timerDisplay').innerText = `⏳ Time's up!`;
            highlightCorrectAnswer();
            errorMap[currentQuestion.q]++;
            setTimeout(() => { loadNextQuestion(); }, 1500);
        }

        // ── End screen ─────────────────────────────────────────────
        function showEndScreen() {
            clearInterval(timerInterval);
            document.getElementById('gameContainer').style.display  = 'none';
            document.getElementById('studyContainer').style.display = 'none';
            document.getElementById('endScreen').style.display      = 'block';
            document.getElementById('progressFill').style.width     = '100%';

            let totalMistakes = 0;
            let hardestWord   = "None!";
            let maxErrors     = 0;

            for (const [word, errors] of Object.entries(errorMap)) {
                totalMistakes += errors;
                if (errors > maxErrors) {
                    maxErrors   = errors;
                    hardestWord = `${word} (${errors} mistakes)`;
                }
            }

            document.getElementById('totalMistakes').innerText = totalMistakes;
            document.getElementById('hardestWord').innerText   =
                (currentMode === 'study' || totalMistakes === 0) ? "Perfect Score! 🌟" : hardestWord;
        }
    </script>
</body>
</html>
